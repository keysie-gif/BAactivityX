<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bikini Bottom</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Kalnia:wght@100..700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            <i class="bi bi-water"></i>
        </div>

        <p class="auth-eyebrow">
            WELCOME BACK
        </p>

        <h1 class="kalnia-font">
            Login
        </h1>

        <p class="auth-description">
            Enter your account details to continue your
            Bikini Bottom adventure.
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm" novalidate>

            <!-- USERNAME -->

            <div class="mb-3">

                <label for="loginUsername" class="form-label">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="loginUsername"
                        name="loginUsername"
                        placeholder="Enter your username"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="loginPassword" class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="loginPassword"
                        name="loginPassword"
                        placeholder="Enter your password"
                    >

                </div>

            </div>


            <div id="loginError" class="login-error">
                Incorrect username or password.
            </div>


            <button
                type="submit"
                class="btn btn-spongebob auth-submit"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>


        <div class="auth-bottom">

            <p>
                Don't have an account?
                <a href="register.html">
                    Register here
                </a>
            </p>

            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-left"></i>
                Back to Bikini Bottom
            </a>

        </div>

    </div>

</div>


<!-- jQuery -->

<script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous">
</script>


<!-- jQuery Validation -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
    integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</script>


<script>

$(document).ready(function () {

    $("#loginForm").validate({

        rules: {

            loginUsername: {
                required: true,
                minlength: 3
            },

            loginPassword: {
                required: true,
                minlength: 7
            }

        },


        messages: {

            loginUsername: {
                required: "Please enter your username.",
                minlength: "Username must be at least 3 characters."
            },

            loginPassword: {
                required: "Please enter your password.",
                minlength: "Password must be at least 7 characters."
            }

        },


        errorElement: "div",

        errorClass: "custom-error",


        highlight: function (element) {

            $(element)
                .addClass("input-error")
                .removeClass("input-success");

        },


        unhighlight: function (element) {

            $(element)
                .removeClass("input-error")
                .addClass("input-success");

        },


        submitHandler: function (form) {

            const username =
                $("#loginUsername").val().trim();

            const password =
                $("#loginPassword").val();


            const savedUsername =
                localStorage.getItem("registeredUsername");

            const savedPassword =
                localStorage.getItem("registeredPassword");


            /*
                Check the account created during registration.
            */

            if (
                username === savedUsername &&
                password === savedPassword
            ) {

                localStorage.setItem(
                    "loggedInUser",
                    username
                );

                /*
                    Landing Page is index.html.
                */

                window.location.href = "index.html";

            } else {

                $("#loginError")
                    .stop(true, true)
                    .slideDown();

            }

        }

    });

});

</script>

</body>
</html>
