<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Bikini Bottom</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Kalnia:wght@100..700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>

        <p class="auth-eyebrow">
            WELCOME TO BIKINI BOTTOM
        </p>

        <h1 class="kalnia-font">
            Create Account
        </h1>

        <p class="auth-description">
            Register now and join the underwater adventure.
        </p>


        <!-- REGISTER FORM -->

        <form id="registerForm" novalidate>

            <!-- FULL NAME -->

            <div class="mb-3">

                <label for="fullName" class="form-label">
                    Full Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                    >

                </div>

            </div>


            <!-- USERNAME -->

            <div class="mb-3">

                <label for="username" class="form-label">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-badge"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                    >

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-spongebob auth-submit"
            >
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>


            <div id="registerSuccess" class="success-message">
                Registration successful! You can now log in.
            </div>

        </form>


        <div class="auth-bottom">

            <p>
                Already have an account?
                <a href="login.html">
                    Login here
                </a>
            </p>

            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-left"></i>
                Back to Bikini Bottom
            </a>

        </div>

    </div>

</div>


<!-- jQuery -->

<script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous">
</script>


<!-- jQuery Validation -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
    integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</script>


<script>

$(document).ready(function () {

    $("#registerForm").validate({

        rules: {

            fullName: {
                required: true,
                minlength: 2,
                maxlength: 50
            },

            username: {
                required: true,
                minlength: 3,
                maxlength: 20
            },

            email: {
                required: true,
                email: true
            },

            password: {
                required: true,
                minlength: 7
            },

            confirmPassword: {
                required: true,
                equalTo: "#password"
            }

        },


        messages: {

            fullName: {
                required: "Please enter your full name.",
                minlength: "Full name must be at least 2 characters.",
                maxlength: "Full name must not exceed 50 characters."
            },

            username: {
                required: "Please choose a username.",
                minlength: "Username must be at least 3 characters.",
                maxlength: "Username must not exceed 20 characters."
            },

            email: {
                required: "Please enter your email address.",
                email: "Please enter a valid email address."
            },

            password: {
                required: "Please create a password.",
                minlength: "Password must be at least 7 characters."
            },

            confirmPassword: {
                required: "Please confirm your password.",
                equalTo: "Passwords do not match."
            }

        },


        errorElement: "div",

        errorClass: "custom-error",

        highlight: function (element) {

            $(element)
                .addClass("input-error")
                .removeClass("input-success");

        },

        unhighlight: function (element) {

            $(element)
                .removeClass("input-error")
                .addClass("input-success");

        },


        submitHandler: function (form) {

            const username = $("#username").val();

            const email = $("#email").val();

            const password = $("#password").val();

            /*
                Save registered information in localStorage.
                This is only for a front-end school project.
            */

            localStorage.setItem(
                "registeredUsername",
                username
            );

            localStorage.setItem(
                "registeredEmail",
                email
            );

            localStorage.setItem(
                "registeredPassword",
                password
            );

            $("#registerSuccess")
                .stop(true, true)
                .slideDown();

            setTimeout(function () {

                window.location.href = "login.html";

            }, 1500);

        }

    });

});

</script>

</body>
</html>
